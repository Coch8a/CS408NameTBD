spring.application.name=trench-roster
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/trench_roster}
spring.datasource.username=${DB_USER:trench_roster}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
