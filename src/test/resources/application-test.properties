# Plain Maven uses H2; test.sh overrides these with isolated real PostgreSQL.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:checkpoint;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
